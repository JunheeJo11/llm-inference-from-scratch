# TTFT, TPOT 기본 설정 (11/24 작성, 11/25 오전 반복 측정에 사용)
# 실행: uv run python scratch/measure_latency.py configs/latency_base.toml

name = "base"              # 결과 파일 이름 앞부분
run = "ts_base"            # runs/ 아래 학습 결과 폴더
dtype = "fp32"             # "fp32" 또는 "bf16"
device = "cuda"

modes = ["cache", "nocache"]   # 캐시 있음, 없음 둘 다
prompt_lens = [4, 64, 128]     # 프롬프트 토큰 수
gen_lens = [64]                # 생성 토큰 수 (P + n <= 256)

warmup = 2                 # 버리는 실행 수
repeats = 5                # 재는 실행 수 (평균, 표준편차용, 2 이상)

out_dir = "runs/latency"
